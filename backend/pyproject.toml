[project]
name = "zipzop-backend"
version = "0.1.0"
description = "AI Video Editor — backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Database
    # `[asyncio]`, because SQLAlchemy 2.1 stopped installing `greenlet` on its
    # own and the async engine cannot import without it. Found in M7 when the
    # first image built from a lockfile could not start the API — every fresh
    # install from these ranges had the same problem, and a developer's old
    # virtualenv, still holding greenlet from 2.0, was what hid it.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",     # Alembic runs sync; asyncpg serves the app

    # Queue and cache
    "celery[redis]>=5.4",
    "redis>=5.2",

    # Storage
    "boto3>=1.35",

    # Auth
    "pyjwt[crypto]>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    # Backs pydantic's EmailStr. Without it the auth schemas raise at import,
    # not at request time, so a missing install fails the process rather than
    # one endpoint.
    "email-validator>=2.2",

    # Speech to text. Self-hosted rather than a paid API — decided 20 August,
    # see docs/11-m4-notes.md §1. Pulls ctranslate2 and onnxruntime, which is
    # why the install is noticeably larger than everything above it.
    #
    # The model itself is NOT bundled: it downloads on first use into
    # ~/.cache/huggingface. Warm that cache when deploying rather than letting
    # the first customer pay for it.
    "faster-whisper>=1.1",

    # Observability
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-boto3",
    # Security gates — docs/07-security.md §7, added in M7. In the dev extras
    # rather than installed ad hoc, so `make security` and CI run the same
    # versions the lockfile pins.
    "bandit>=1.8",
    "pip-audit>=2.7",
    # Produces requirements.lock / requirements-dev.lock (`make lock`).
    "uv>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ----------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

# Celery ships no type information for its decorators, so every @task would
# otherwise be reported as making its function untyped. The task bodies are
# still checked — only the decorator is exempted.
[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

# redis.asyncio.from_url is untyped upstream.
[[tool.mypy.overrides]]
module = ["app.services.redis_client"]
disallow_untyped_calls = false

# --------------------------------------------------------------------- pytest

[tool.bandit]
# Security static analysis — docs/07-security.md §7, added in M7. Runs on every
# PR (`make security`). The skips below are the reviewed, accepted set; anything
# not listed here still fails the gate, which is the point of running it.
exclude_dirs = ["tests", ".venv"]
skips = [
    "B101",  # assert: used only for FK-guaranteed invariants (`assert plan is not None`),
    #          never for control flow, authorisation or input validation.
    "B404",  # import subprocess: ffmpeg/ffprobe are shelled out by necessity (§6.4).
    "B603",  # subprocess without shell: every call passes an argument *list*, never a
    #          string, and every one on user media pins `-protocol_whitelist file`.
    "B607",  # partial executable path: ffmpeg/ffprobe resolve from PATH, by design.
]
# B104 (bind 0.0.0.0) and B105 (the dev-default guard) are handled inline with
# `# nosec` at their one site each, so those checks stay live everywhere else.

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Both of these, and both "session". The engine is built once for the run, so
# it is bound to the session loop; a test running in its own function-scoped
# loop then hands asyncpg a future from the wrong loop and every test in the
# file fails with "attached to a different loop". Setting only the fixture
# scope is not enough — the test scope has to match it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "storage: needs MinIO on S3_ENDPOINT_URL",
    "ffmpeg: needs ffmpeg and ffprobe on PATH",
]
