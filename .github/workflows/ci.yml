name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zipzop
          POSTGRES_PASSWORD: zipzop
          POSTGRES_DB: zipzop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zipzop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # M2's upload flow is presigned URLs against S3. A mock cannot fail the
      # way the real thing does — a signature that does not verify, path-style
      # addressing, a Content-Type that is part of the signature — so the tests
      # run against a real MinIO here too.
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: zipzop
          MINIO_ROOT_PASSWORD: zipzop-dev-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://zipzop:zipzop@localhost:5432/zipzop_test
      REDIS_URL: redis://localhost:6379/9
      CELERY_BROKER_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-only-secret
      ENVIRONMENT: test
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: zipzop-media-test
      S3_ACCESS_KEY_ID: zipzop
      S3_SECRET_ACCESS_KEY: zipzop-dev-secret
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The ingest worker shells out to both. Without them every media test
      # fails on a missing binary rather than on anything about the code.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .

      - name: Type-check
        working-directory: backend
        run: mypy app

      - name: Migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head

      # The models and the migrations must describe the same schema. Without
      # this, a column added to a model and forgotten in a migration passes
      # every test — the test database is built from the migrations, so the
      # application simply never sees the column it thinks it has.
      - name: Models match the migrated schema
        working-directory: backend
        run: alembic check

      - name: Test
        working-directory: backend
        run: pytest -q

      # The contract is the one thing both sides depend on. A stale
      # openapi.json means the frontend is generating types from a lie.
      - name: openapi.json is current
        run: |
          python -m app.scripts.dump_openapi /tmp/openapi.check.json
          # openapi.json lives at the repository root, and this step runs in
          # backend/ — so the path has to climb out. Without the `..` the diff
          # fails on a missing file, which the `||` then reports as a stale
          # contract: a message that sends you to regenerate a file that was
          # never the problem.
          diff -q ../openapi.json /tmp/openapi.check.json \
            || (echo "::error::openapi.json is stale — run 'make openapi' and commit it" && exit 1)
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the development machine. CI diverging from dev is the
          # first thing to suspect when something works locally and not here.
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # generated.ts is gitignored — it is derived from the committed
      # openapi.json and committing it would let the two drift. That means CI
      # has to generate it before anything type-checks: every step below this
      # one fails on a missing module otherwise.
      - name: Generate API types from the committed contract
        working-directory: frontend
        run: pnpm generate:types

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type-check
        working-directory: frontend
        run: pnpm typecheck

      - name: Test
        working-directory: frontend
        # `pnpm test --run` makes pnpm itself reject `--run` as an unknown
        # option. The script is `vitest run`, so it never watches anyway.
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build
