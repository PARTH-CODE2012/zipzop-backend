name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default (docs/07-security.md §5.4). Nothing here writes to the
# repository, so the token each job receives cannot either — a compromised
# step gets a credential that can read code it could already read.
permissions:
  contents: read

# Every third-party action below is pinned to a commit SHA, with the tag it
# was resolved from beside it. A tag is a pointer its owner can move; a SHA is
# the code that was reviewed. Resolved 29 September 2026 (M7) against the
# latest patch of the major version this workflow already used.

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zipzop
          POSTGRES_PASSWORD: zipzop
          POSTGRES_DB: zipzop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zipzop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # MinIO is NOT here. It is started as a step below, and it has to be —
      # see the comment on that step. A service container cannot run it.
    env:
      DATABASE_URL: postgresql+asyncpg://zipzop:zipzop@localhost:5432/zipzop_test
      REDIS_URL: redis://localhost:6379/9
      CELERY_BROKER_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-only-secret
      ENVIRONMENT: test
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: zipzop-media-test
      S3_ACCESS_KEY_ID: zipzop
      S3_SECRET_ACCESS_KEY: zipzop-dev-secret
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # The ingest worker shells out to both. Without them every media test
      # fails on a missing binary rather than on anything about the code.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # M2's upload flow is presigned URLs against S3. A mock cannot fail the
      # way the real thing does — a signature that does not verify, path-style
      # addressing, a Content-Type that is part of the signature — so the tests
      # run against a real MinIO here too.
      #
      # **A step, not a `services:` entry, and this is not a style choice.**
      # `minio/minio` needs `server /data` as its command, and a service
      # container has no way to supply one: the `services:` block accepts
      # image, env, ports, volumes, options and credentials, and `options` are
      # passed to `docker create` *before* the image name, where a command
      # cannot go. Run with no command the image prints its usage and exits —
      # so the MinIO service this job used to declare was never a running
      # server, and no health command could have made it one. Found 27 August
      # 2026, when an audit proposed changing that health command; the check
      # was never the problem.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=zipzop \
            -e MINIO_ROOT_PASSWORD=zipzop-dev-secret \
            minio/minio:latest server /data
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::MinIO did not become ready in 80s"
          docker logs minio
          exit 1

      # From the lockfile, hashes checked — the same set the image installs and
      # a developer gets from `make install-backend`. `pip install -e .[dev]`
      # resolved ranges on every run, so CI was testing whatever PyPI served
      # that minute rather than what had been reviewed (M7, §5.4).
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .

      - name: Type-check
        working-directory: backend
        run: mypy app

      - name: Migrations apply cleanly
        working-directory: backend
        run: alembic upgrade head

      # The models and the migrations must describe the same schema. Without
      # this, a column added to a model and forgotten in a migration passes
      # every test — the test database is built from the migrations, so the
      # application simply never sees the column it thinks it has.
      - name: Models match the migrated schema
        working-directory: backend
        run: alembic check

      - name: Test
        working-directory: backend
        run: pytest -q

      # The contract is the one thing both sides depend on. A stale
      # openapi.json means the frontend is generating types from a lie.
      - name: openapi.json is current
        run: |
          python -m app.scripts.dump_openapi /tmp/openapi.check.json
          # openapi.json lives at the repository root, and this step runs in
          # backend/ — so the path has to climb out. Without the `..` the diff
          # fails on a missing file, which the `||` then reports as a stale
          # contract: a message that sends you to regenerate a file that was
          # never the problem.
          diff -q ../openapi.json /tmp/openapi.check.json \
            || (echo "::error::openapi.json is stale — run 'make openapi' and commit it" && exit 1)
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches the development machine. CI diverging from dev is the
          # first thing to suspect when something works locally and not here.
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # generated.ts is gitignored — it is derived from the committed
      # openapi.json and committing it would let the two drift. That means CI
      # has to generate it before anything type-checks: every step below this
      # one fails on a missing module otherwise.
      - name: Generate API types from the committed contract
        working-directory: frontend
        run: pnpm generate:types

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type-check
        working-directory: frontend
        run: pnpm typecheck

      - name: Test
        working-directory: frontend
        # `pnpm test --run` makes pnpm itself reject `--run` as an unknown
        # option. The script is `vitest run`, so it never watches anyway.
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build
